name: FUND16 Category Comparison Artifact

on:
  pull_request:
    paths:
      - "services/turkiye_fund_category_comparison.py"
      - "scripts/run_turkiye_fund_category_comparison.py"
      - "tests/test_turkiye_fund_category_comparison.py"
      - "tests/test_fund16_category_workflow.py"
      - ".github/workflows/fund15_category_research.yml"
      - ".github/workflows/fund16_category_comparison.yml"
  push:
    branches:
      - main
    paths:
      - "services/turkiye_fund_category_comparison.py"
      - "scripts/run_turkiye_fund_category_comparison.py"
      - "tests/test_turkiye_fund_category_comparison.py"
      - "tests/test_fund16_category_workflow.py"
      - ".github/workflows/fund15_category_research.yml"
      - ".github/workflows/fund16_category_comparison.yml"
  workflow_run:
    workflows:
      - "FUND15 Category Research Artifact"
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: fund16-category-comparison-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  focused-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Install test runner
        run: python -m pip install pytest

      - name: FUND16 focused tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_turkiye_fund_category_research.py \
            tests/test_turkiye_fund_category_comparison.py \
            tests/test_fund16_category_workflow.py

  build-category-comparison-artifact:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact FUND15 source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Download exact FUND15 category research artifact
        uses: actions/download-artifact@v5
        with:
          name: fund15-category-research-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/fund15
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate upstream FUND15 provenance and firewall
        env:
          FUND15_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"]) / "fund15" / "category_research_artifact.json"
          if not p.is_file():
              raise SystemExit("FUND15 category research artifact missing")

          d = json.loads(p.read_text(encoding="utf-8"))
          expected_head = os.environ["FUND15_HEAD_SHA"]

          assert d.get("schema_version") == "fund15_category_research_artifact_1"
          assert d.get("research_only") is True
          assert d.get("execution_authority") is False
          assert d.get("production_persist") is False
          assert d.get("cross_category_winner") is None
          assert d.get("cross_category_composite_score") is None

          source = d.get("source") or {}
          assert source.get("fund14b_schema_version") == "fund14b_candidate_artifact_4"
          upstream = source.get("source") or {}
          assert upstream.get("source_head") == expected_head

          threshold = source.get("threshold_policy") or {}
          assert threshold.get("locked") is True
          assert threshold.get("fi_min") == 60.0
          assert threshold.get("source") == "human_decision"
          assert threshold.get("decision_id") == "FUND14B-FI60-2026-09-11"

          categories = d.get("categories") or []
          flat = [
              candidate
              for group in categories
              for candidate in (group.get("candidates") or [])
          ]
          counts = d.get("counts") or {}
          assert len(categories) == counts.get("categories")
          assert len(flat) == counts.get("promotion_eligible")
          assert len({row.get("fund_code") for row in flat}) == len(flat)

          proof = d.get("write_proof") or {}
          expected_zero = {
              "production_writes": 0,
              "trade_actions": 0,
              "orders": 0,
              "portfolio_writes": 0,
              "eight_e_calls": 0,
              "new_money_calls": 0,
          }
          assert proof == expected_zero

          print("PASS: exact FUND15 provenance + research firewall")
          print("source_head:", upstream.get("source_head"))
          print("promotion_eligible:", counts.get("promotion_eligible"))
          print("categories:", counts.get("categories"))
          PY

      - name: Build FUND16 category comparison artifact
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p .artifacts/fund16
          python scripts/run_turkiye_fund_category_comparison.py \
            --input "${RUNNER_TEMP}/fund15/category_research_artifact.json" \
            --output .artifacts/fund16/category_comparison_artifact.json \
            2>&1 | tee .artifacts/fund16/run.log

      - name: Validate FUND16 category comparison contract
        env:
          FUND15_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path(".artifacts/fund16/category_comparison_artifact.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          assert d.get("schema_version") == "fund16_category_comparison_artifact_1"
          assert d.get("research_only") is True
          assert d.get("execution_authority") is False
          assert d.get("production_persist") is False
          assert d.get("cross_category_winner") is None
          assert d.get("cross_category_composite_score") is None
          assert d.get("recommendation") is None

          source = d.get("source") or {}
          assert source.get("fund15_schema_version") == "fund15_category_research_artifact_1"
          fund15_source = source.get("source") or {}
          assert fund15_source.get("fund14b_schema_version") == "fund14b_candidate_artifact_4"
          upstream = fund15_source.get("source") or {}
          assert upstream.get("source_head") == os.environ["FUND15_HEAD_SHA"]

          threshold = fund15_source.get("threshold_policy") or {}
          assert threshold.get("locked") is True
          assert threshold.get("fi_min") == 60.0
          assert threshold.get("source") == "human_decision"
          assert threshold.get("decision_id") == "FUND14B-FI60-2026-09-11"

          categories = d.get("categories") or []
          counts = d.get("counts") or {}
          flat = [
              candidate
              for group in categories
              for candidate in (group.get("candidates") or [])
          ]
          assert len(categories) == counts.get("categories")
          assert len(flat) == counts.get("promotion_eligible")
          assert counts.get("peer_comparable_categories") == sum(
              1 for group in categories if group.get("peer_comparison_available") is True
          )

          for group in categories:
              assert group.get("winner") is None
              assert group.get("composite_score") is None
              rows = group.get("candidates") or []
              if len(rows) < 2:
                  assert group.get("peer_comparison_available") is False
                  assert all(row.get("return_1y_rank") is None for row in rows)
                  assert all(row.get("drawdown_resilience_rank") is None for row in rows)

          proof = d.get("write_proof") or {}
          expected_zero = {
              "production_writes": 0,
              "trade_actions": 0,
              "orders": 0,
              "portfolio_writes": 0,
              "eight_e_calls": 0,
              "new_money_calls": 0,
          }
          assert proof == expected_zero

          print("PASS: FUND16 category comparison contract")
          print("PASS: no winner/composite/recommendation")
          print("PASS: singleton categories do not fake peer ranks")
          print("PASS: execution/write authority remains zero")
          print("categories:", [g.get("category") for g in categories])
          PY

      - name: Upload FUND16 category comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fund16-category-comparison-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .artifacts/fund16/category_comparison_artifact.json
            .artifacts/fund16/run.log
