name: FUND13 Calibration History

on:
  pull_request:
    paths:
      - "scripts/fund13_capture_calibration.py"
      - "scripts/fund13_analyze_calibration.py"
      - "scripts/fund13_collect_actions_history.py"
      - "tests/test_fund13_calibration_history.py"
      - "tests/test_fund13_calibration_workflow.py"
      - ".github/workflows/fund13_calibration_history.yml"
      - ".github/workflows/fund14b_candidate_artifact.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/fund13_capture_calibration.py"
      - "scripts/fund13_analyze_calibration.py"
      - "scripts/fund13_collect_actions_history.py"
      - "tests/test_fund13_calibration_history.py"
      - "tests/test_fund13_calibration_workflow.py"
      - ".github/workflows/fund13_calibration_history.yml"
      - ".github/workflows/fund14b_candidate_artifact.yml"
  workflow_run:
    workflows:
      - "FUND14B Candidate Artifact"
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: fund13-calibration-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  focused-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run FUND13 contract tests
        run: |
          python -m unittest -q \
            tests/test_fund13_calibration_history.py \
            tests/test_fund13_calibration_workflow.py

  detect-fund14b-artifact:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact_found: ${{ steps.detect.outputs.artifact_found }}
      artifact_name: ${{ steps.detect.outputs.artifact_name }}

    steps:
      - name: Detect exact FUND14B evidence artifact
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const expected = `fund14b-candidate-artifact-${runId}`;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              }
            );
            const matches = artifacts.filter(
              (a) => a.name === expected && !a.expired
            );
            if (matches.length > 1) {
              core.setFailed(`multiple exact FUND14B artifacts: ${expected}`);
              return;
            }
            core.setOutput("artifact_name", expected);
            core.setOutput(
              "artifact_found",
              matches.length === 1 ? "true" : "false"
            );
            core.info(
              matches.length === 1
                ? `PASS: exact FUND14B artifact found: ${expected}`
                : `NO-OP: no FUND14B candidate artifact in run ${runId}`
            );

  capture-calibration:
    needs:
      - focused-contract-tests
      - detect-fund14b-artifact
    if: >-
      needs.detect-fund14b-artifact.outputs.artifact_found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout calibration code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact FUND14B candidate artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.detect-fund14b-artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/fund14b
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture immutable FUND13 observation
        run: |
          set -euo pipefail
          mkdir -p .artifacts/fund13/current
          python scripts/fund13_capture_calibration.py \
            --artifact "${RUNNER_TEMP}/fund14b/candidate_artifact.json" \
            --history-dir .artifacts/fund13/current \
            2>&1 | tee .artifacts/fund13/capture.log

          count="$(find .artifacts/fund13/current -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')"
          test "$count" = "1"

          cp \
            "$(find .artifacts/fund13/current -maxdepth 1 -name '*.json' -print -quit)" \
            .artifacts/fund13/current_observation.json

      - name: Collect previous FUND13 observations read-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/fund13/history
          python scripts/fund13_collect_actions_history.py \
            --repository "${GITHUB_REPOSITORY_NAME}" \
            --history-dir .artifacts/fund13/history \
            --current-observation .artifacts/fund13/current_observation.json \
            --exclude-run-id "${CURRENT_RUN_ID}" \
            2>&1 | tee .artifacts/fund13/history_collect.log

      - name: Analyze accumulated calibration history
        run: |
          set -euo pipefail
          python scripts/fund13_analyze_calibration.py \
            --history-dir .artifacts/fund13/history \
            --output .artifacts/fund13/fund13_history_analysis_v3.json \
            2>&1 | tee .artifacts/fund13/analysis.log

      - name: Validate no threshold or execution authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(".artifacts/fund13/fund13_history_analysis_v3.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          assert d["analysis_version"] == "fund13_calibration_history_analysis_3"
          assert d["source_contract"] == "fund14b_candidate_artifact_4"
          assert d["thresholds_proposed"] is False
          assert d["thresholds_locked"] is False
          assert d["band_policy_applied"] is False
          assert d["global_review_minimum_distinct_dates"] == 4

          print("PASS: threshold proposal disabled")
          print("PASS: threshold lock disabled")
          print("PASS: recommendation band policy disabled")
          print("distinct_dates:", d["distinct_dates"])
          print(
              "global_threshold_review_ready:",
              d["global_threshold_review_ready"],
          )
          PY

      - name: Upload immutable FUND13 observation
        uses: actions/upload-artifact@v4
        with:
          name: fund13-calibration-observation
          if-no-files-found: error
          retention-days: 90
          path: .artifacts/fund13/current_observation.json

      - name: Upload FUND13 analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fund13-calibration-analysis-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            .artifacts/fund13/fund13_history_analysis_v3.json
            .artifacts/fund13/capture.log
            .artifacts/fund13/history_collect.log
            .artifacts/fund13/analysis.log
