name: Candidate Contract CI

on:
  pull_request:
    paths:
      - "services/candidate_*.py"
      - "tests/test_candidate_*.py"
      - "services/fund_product_contract.py"
      - "services/turkiye_fund_universe_contract.py"
      - "services/security_intelligence_contract.py"
      - ".github/workflows/candidate_contract_ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/candidate_*.py"
      - "tests/test_candidate_*.py"
      - "services/fund_product_contract.py"
      - "services/turkiye_fund_universe_contract.py"
      - "services/security_intelligence_contract.py"
      - ".github/workflows/candidate_contract_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-contract-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Install test runner
        run: python -m pip install pytest

      - name: Candidate contract tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_candidate_*.py
