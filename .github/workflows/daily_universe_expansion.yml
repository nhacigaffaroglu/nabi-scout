name: Daily Universe Expansion

on:
  schedule:
    # Halal-first: participation onboarding before automatic Scanner.
    # 06:00 Europe/Istanbul (UTC+3, no DST) == 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Estimate only; no provider calls or DB writes"
        type: boolean
        default: false
      max_symbols:
        description: "Optional per-run safety cap (empty = env default)"
        type: string
        default: ""
      allow_second_run_today:
        description: "Allow a second paid expansion run for today's Istanbul date"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nabi-daily-universe-expansion
  cancel-in-progress: false

jobs:
  daily-universe-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL"; exit 1; }
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -z "$SUPABASE_KEY" ]; then
            echo "Missing SUPABASE_SERVICE_ROLE_KEY (or legacy SUPABASE_KEY service role)"
            exit 1
          fi
          test -n "$FMP_API_KEY" || { echo "Missing FMP_API_KEY"; exit 1; }
          test -n "$SEC_CONTACT_EMAIL" || { echo "Missing SEC_CONTACT_EMAIL"; exit 1; }

      - name: Run daily universe expansion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eo pipefail
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args+=(--trigger-type workflow_dispatch)
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              args+=(--dry-run)
            fi
            if [ -n "${{ inputs.max_symbols }}" ]; then
              args+=(--max-symbols "${{ inputs.max_symbols }}")
            fi
            if [ "${{ inputs.allow_second_run_today }}" = "true" ]; then
              args+=(--allow-second-run-today)
            fi
          else
            args+=(--trigger-type scheduled)
          fi
          python scripts/run_daily_universe_expansion.py "${args[@]}"
