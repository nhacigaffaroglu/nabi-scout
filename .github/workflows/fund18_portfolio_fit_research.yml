name: FUND18 Portfolio Fit Research

on:
  pull_request:
    paths:
      - "services/turkiye_fund_portfolio_fit_research.py"
      - "scripts/run_turkiye_fund_portfolio_fit_research.py"
      - "tests/test_turkiye_fund_portfolio_fit_research.py"
      - "tests/test_run_turkiye_fund_portfolio_fit_research.py"
      - "tests/test_turkiye_fund_portfolio_fit.py"
      - "tests/test_turkiye_fund_portfolio_context_bridge.py"
      - "tests/test_fund18_portfolio_fit_research_workflow.py"
      - ".github/workflows/fund18_portfolio_fit_research.yml"

  push:
    branches:
      - main
    paths:
      - "services/turkiye_fund_portfolio_fit_research.py"
      - "scripts/run_turkiye_fund_portfolio_fit_research.py"
      - "tests/test_turkiye_fund_portfolio_fit_research.py"
      - "tests/test_run_turkiye_fund_portfolio_fit_research.py"
      - "tests/test_turkiye_fund_portfolio_fit.py"
      - "tests/test_turkiye_fund_portfolio_context_bridge.py"
      - "tests/test_fund18_portfolio_fit_research_workflow.py"
      - ".github/workflows/fund18_portfolio_fit_research.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund18-portfolio-fit-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-fit-research-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Install test runner
        run: python -m pip install pytest

      - name: FUND18 focused contract tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_turkiye_fund_portfolio_fit_research.py \
            tests/test_run_turkiye_fund_portfolio_fit_research.py \
            tests/test_turkiye_fund_portfolio_fit.py \
            tests/test_turkiye_fund_portfolio_context_bridge.py \
            tests/test_fund18_portfolio_fit_research_workflow.py

      - name: Compile FUND18
        run: |
          python -m py_compile \
            services/turkiye_fund_portfolio_fit_research.py \
            scripts/run_turkiye_fund_portfolio_fit_research.py

      - name: Validate FUND18 research-only firewall
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from services.turkiye_fund_portfolio_fit_research import (
              build_portfolio_fit_research_artifact,
          )

          zero = {
              "production_writes": 0,
              "trade_actions": 0,
              "orders": 0,
              "portfolio_writes": 0,
              "eight_e_calls": 0,
              "new_money_calls": 0,
          }

          fund17 = {
              "schema_version": "fund17_portfolio_fit_artifact_1",
              "source": {
                  "fund16_schema_version":
                      "fund16_category_comparison_artifact_1",
                  "source": {},
              },
              "generated_at": "2026-09-11T18:00:00Z",
              "research_only": True,
              "execution_authority": False,
              "production_persist": False,
              "portfolio_context_available": True,
              "portfolio_context": {
                  "schema_version": "fund17_portfolio_context_1",
                  "human_supplied": True,
                  "research_only": True,
                  "execution_authority": False,
                  "desired_roles": ["diversification"],
                  "existing_exposures": ["equity"],
                  "constraints": ["research only"],
                  "notes": "CI fixture only; not real portfolio data.",
              },
              "portfolio_fit_status":
                  "READY_FOR_PORTFOLIO_FIT_RESEARCH",
              "portfolio_fit_winner": None,
              "portfolio_fit_composite_score": None,
              "recommendation": None,
              "counts": {
                  "candidates": 1,
                  "context_ready": 1,
                  "context_required": 0,
              },
              "candidates": [
                  {
                      "fund_code": "IAT",
                      "fund_name": "IAT Fund",
                      "category": "sukuk",
                      "fi_score": 60.49,
                      "fi_state": "NEUTRAL",
                      "return_1y": 40.76,
                      "return_1y_rank": None,
                      "max_drawdown": -0.22,
                      "drawdown_resilience_rank": None,
                      "portfolio_fit_status":
                          "READY_FOR_PORTFOLIO_FIT_RESEARCH",
                      "role_fit": None,
                      "economic_overlap": None,
                      "diversification_contribution": None,
                      "concentration_risk": None,
                      "portfolio_fit_composite_score": None,
                      "portfolio_fit_rank": None,
                      "recommendation": None,
                  }
              ],
              "write_proof": zero,
          }

          assessments = {
              "IAT": {
                  "fund_code": "IAT",
                  "role_fit": "STRONG",
                  "economic_overlap": "LOW",
                  "diversification_contribution": "HIGH",
                  "concentration_risk": "LOW",
                  "rationale": [
                      "Synthetic CI fixture only; not investment advice."
                  ],
              }
          }

          result = build_portfolio_fit_research_artifact(
              fund17,
              assessments=assessments,
          )

          assert result["research_only"] is True
          assert result["execution_authority"] is False
          assert result["production_persist"] is False
          assert result["portfolio_fit_winner"] is None
          assert result["portfolio_fit_composite_score"] is None
          assert result["recommendation"] is None
          assert result["write_proof"] == zero

          row = result["candidates"][0]
          assert row["portfolio_fit_composite_score"] is None
          assert row["portfolio_fit_rank"] is None
          assert row["recommendation"] is None

          print("PASS: descriptive dimensions only")
          print("PASS: no composite/rank/winner/recommendation")
          print("PASS: no writes/execution/8E/New Money")
          PY
