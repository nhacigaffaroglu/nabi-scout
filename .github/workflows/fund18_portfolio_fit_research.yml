name: FUND18 Portfolio Fit Research

on:
  pull_request:
    paths:
      - "services/turkiye_fund_portfolio_fit_research.py"
      - "services/turkiye_fund_portfolio_fit_evidence.py"
      - "scripts/run_turkiye_fund_portfolio_fit_research.py"
      - "tests/test_turkiye_fund_portfolio_fit_research.py"
      - "tests/test_turkiye_fund_portfolio_fit_evidence.py"
      - "tests/test_turkiye_fund_portfolio_fit_research_evidence.py"
      - "tests/test_run_turkiye_fund_portfolio_fit_research.py"
      - "tests/test_turkiye_fund_portfolio_fit.py"
      - "tests/test_turkiye_fund_portfolio_context_bridge.py"
      - "tests/test_fund18_portfolio_fit_research_workflow.py"
      - ".github/workflows/fund18_portfolio_fit_research.yml"

  push:
    branches:
      - main
    paths:
      - "services/turkiye_fund_portfolio_fit_research.py"
      - "services/turkiye_fund_portfolio_fit_evidence.py"
      - "scripts/run_turkiye_fund_portfolio_fit_research.py"
      - "tests/test_turkiye_fund_portfolio_fit_research.py"
      - "tests/test_turkiye_fund_portfolio_fit_evidence.py"
      - "tests/test_turkiye_fund_portfolio_fit_research_evidence.py"
      - "tests/test_run_turkiye_fund_portfolio_fit_research.py"
      - "tests/test_turkiye_fund_portfolio_fit.py"
      - "tests/test_turkiye_fund_portfolio_context_bridge.py"
      - "tests/test_fund18_portfolio_fit_research_workflow.py"
      - ".github/workflows/fund18_portfolio_fit_research.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund18-portfolio-fit-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-fit-research-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Install test runner
        run: python -m pip install pytest

      - name: FUND18 focused contract tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_turkiye_fund_portfolio_fit_research.py \
            tests/test_turkiye_fund_portfolio_fit_evidence.py \
            tests/test_turkiye_fund_portfolio_fit_research_evidence.py \
            tests/test_run_turkiye_fund_portfolio_fit_research.py \
            tests/test_turkiye_fund_portfolio_fit.py \
            tests/test_turkiye_fund_portfolio_context_bridge.py \
            tests/test_fund18_portfolio_fit_research_workflow.py

      - name: Compile FUND18
        run: |
          python -m py_compile \
            services/turkiye_fund_portfolio_fit_research.py \
            services/turkiye_fund_portfolio_fit_evidence.py \
            scripts/run_turkiye_fund_portfolio_fit_research.py

      - name: Validate FUND18 evidence-backed firewall
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from services.turkiye_fund_portfolio_fit_research import (
              build_evidence_backed_portfolio_fit_research_artifact,
          )

          zero = {
              "production_writes": 0,
              "trade_actions": 0,
              "orders": 0,
              "portfolio_writes": 0,
              "eight_e_calls": 0,
              "new_money_calls": 0,
          }

          fund17 = {
              "schema_version": "fund17_portfolio_fit_artifact_1",
              "source": {
                  "fund16_schema_version":
                      "fund16_category_comparison_artifact_1",
                  "source": {},
              },
              "generated_at": "2026-09-11T18:00:00Z",
              "research_only": True,
              "execution_authority": False,
              "production_persist": False,
              "portfolio_context_available": True,
              "portfolio_context": {
                  "schema_version": "fund17_portfolio_context_1",
                  "human_supplied": True,
                  "research_only": True,
                  "execution_authority": False,
                  "desired_roles": ["diversification"],
                  "existing_exposures": ["equity"],
                  "constraints": ["research only"],
                  "notes": "CI fixture only; not real portfolio data.",
              },
              "portfolio_fit_status":
                  "READY_FOR_PORTFOLIO_FIT_RESEARCH",
              "portfolio_fit_winner": None,
              "portfolio_fit_composite_score": None,
              "recommendation": None,
              "counts": {
                  "candidates": 1,
                  "context_ready": 1,
                  "context_required": 0,
              },
              "candidates": [
                  {
                      "fund_code": "IAT",
                      "fund_name": "IAT Fund",
                      "category": "sukuk",
                      "fi_score": 60.49,
                      "fi_state": "NEUTRAL",
                      "return_1y": 40.76,
                      "return_1y_rank": None,
                      "max_drawdown": -0.22,
                      "drawdown_resilience_rank": None,
                  }
              ],
              "write_proof": zero,
          }

          assessments = {
              "IAT": {
                  "fund_code": "IAT",
                  "role_fit": "STRONG",
                  "economic_overlap": "LOW",
                  "diversification_contribution": "HIGH",
                  "concentration_risk": "LOW",
                  "rationale": [
                      "Synthetic CI fixture only; not investment advice."
                  ],
              }
          }

          source = {
              "source_type": "FUND17_PORTFOLIO_CONTEXT",
              "source_id": "synthetic-ci-context-1",
              "observed_fact": "Synthetic CI evidence only.",
              "as_of": "2026-09-11T18:00:00Z",
          }

          def dimension(state="SUPPORTED"):
              return {
                  "state": state,
                  "sources": [source] if state == "SUPPORTED" else [],
                  "rationale": [
                      f"Synthetic {state.lower()} evidence fixture."
                  ],
              }

          evidence = {
              "IAT": {
                  "schema_version":
                      "fund18_portfolio_fit_evidence_1",
                  "fund_code": "IAT",
                  "research_only": True,
                  "execution_authority": False,
                  "production_persist": False,
                  "dimensions": {
                      "role_fit": dimension(),
                      "economic_overlap": dimension(),
                      "diversification_contribution": dimension(),
                      "concentration_risk": dimension(),
                  },
              }
          }

          result = (
              build_evidence_backed_portfolio_fit_research_artifact(
                  fund17,
                  assessments=assessments,
                  evidence=evidence,
              )
          )

          assert result["research_only"] is True
          assert result["execution_authority"] is False
          assert result["production_persist"] is False
          assert result["portfolio_fit_winner"] is None
          assert result["portfolio_fit_composite_score"] is None
          assert result["recommendation"] is None
          assert result["write_proof"] == zero

          row = result["candidates"][0]

          assert row["role_fit"] == "STRONG"
          assert row["portfolio_fit_composite_score"] is None
          assert row["portfolio_fit_rank"] is None
          assert row["recommendation"] is None
          assert (
              row["evidence"]["schema_version"]
              == "fund18_portfolio_fit_evidence_1"
          )

          insufficient = evidence.copy()
          insufficient = {
              "IAT": {
                  **evidence["IAT"],
                  "dimensions": {
                      **evidence["IAT"]["dimensions"],
                      "role_fit": dimension("INSUFFICIENT"),
                  },
              }
          }

          fail_closed = (
              build_evidence_backed_portfolio_fit_research_artifact(
                  fund17,
                  assessments=assessments,
                  evidence=insufficient,
              )
          )

          assert fail_closed["candidates"][0]["role_fit"] == "UNKNOWN"

          print("PASS: descriptive dimensions require evidence")
          print("PASS: insufficient evidence maps to UNKNOWN")
          print("PASS: no composite/rank/winner/recommendation")
          print("PASS: no writes/execution/8E/New Money")
          PY
