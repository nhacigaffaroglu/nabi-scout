name: FUND23 Recommendation Layer

on:
  push:
    paths:
      - "services/turkiye_fund_recommendation_layer.py"
      - "tests/test_turkiye_fund_recommendation_layer.py"
      - "tests/test_fund23_recommendation_layer_workflow.py"
      - ".github/workflows/fund23_recommendation_layer.yml"

  pull_request:
    paths:
      - "services/turkiye_fund_recommendation_layer.py"
      - "tests/test_turkiye_fund_recommendation_layer.py"
      - "tests/test_fund23_recommendation_layer_workflow.py"
      - ".github/workflows/fund23_recommendation_layer.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund23-recommendation-layer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recommendation-layer-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run focused FUND23 tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_turkiye_fund_recommendation_layer.py \
            tests/test_fund23_recommendation_layer_workflow.py

      - name: Compile FUND23 service
        run: |
          PYTHONPATH=. python -m py_compile \
            services/turkiye_fund_recommendation_layer.py

      - name: Validate FUND23 research firewall
        run: |
          PYTHONPATH=. python - <<'PY'
          from services.portfolio_security_decision_contract import (
              DECISION_CONSIDER_NEW_POSITION,
              DECISION_HOLD,
          )
          from services.turkiye_fund_recommendation_layer import (
              INPUT_SCHEMA,
              INPUT_STATUS,
              OUTPUT_STATUS,
              ZERO_WRITE_PROOF,
              build_fund_recommendation_layer_artifact,
          )

          def candidate(code, rank, decision):
              return {
                  "fund_code": code,
                  "decision_rank": rank,
                  "decision_evaluation_source_rank": rank,
                  "canonical_decision_source_rank": rank,
                  "canonical_decision_integration_state":
                      "CANONICAL_DECISION_EVALUATED",
                  "canonical_decision": decision,
                  "canonical_decision_payload": {
                      "symbol": code,
                      "decision": decision,
                      "confidence": "HIGH",
                      "reason_codes": ["TEST_REASON"],
                  },
                  "canonical_decision_reasons": [
                      "TEST_REASON"
                  ],
                  "canonical_snapshot_provenance": {
                      "participation_row_id": f"p-{code}",
                      "participation_methodology_id": "m1",
                      "participation_methodology_version": "v1",
                      "participation_semantic_identity":
                          f"sem-{code}",
                      "fi_row_id": f"fi-{code}",
                      "fi_as_of_key": "2026-09-13",
                      "fi_facts_version": "facts-v1",
                      "fi_engine_version": "engine-v1",
                  },
                  "decision_winner": None,
                  "recommendation": None,
                  "allocation": None,
              }

          upstream = {
              "schema_version": INPUT_SCHEMA,
              "source_schema_version":
                  "fund21_decision_evaluation_readiness_artifact_1",
              "generated_at": "2026-09-13T12:00:00+00:00",
              "research_only": True,
              "execution_authority": False,
              "production_persist": False,
              "canonical_decision_integration_status":
                  INPUT_STATUS,
              "decision_winner": None,
              "recommendation": None,
              "allocation": None,
              "counts": {},
              "candidates": [
                  candidate(
                      "BBB",
                      2,
                      DECISION_HOLD,
                  ),
                  candidate(
                      "AAA",
                      1,
                      DECISION_CONSIDER_NEW_POSITION,
                  ),
              ],
              "write_proof": {
                  "production_writes": 0,
                  "trade_actions": 0,
                  "orders": 0,
                  "portfolio_writes": 0,
                  "eight_e_persistence_writes": 0,
                  "new_money_calls": 0,
              },
          }

          result = build_fund_recommendation_layer_artifact(
              upstream,
              generated_at="2026-09-13T13:00:00+00:00",
          )

          assert (
              result["recommendation_layer_status"]
              == OUTPUT_STATUS
          )

          assert result["research_only"] is True
          assert result["execution_authority"] is False
          assert result["production_persist"] is False

          assert result["decision_winner"] is None
          assert result["recommended_symbol"] is None
          assert result["allocation"] is None
          assert result["target_weight"] is None
          assert result["quantity"] is None
          assert result["trade"] is None
          assert result["order"] is None

          assert result["write_proof"] == ZERO_WRITE_PROOF

          rows = result["candidates"]

          assert [
              row["fund_code"] for row in rows
          ] == ["BBB", "AAA"]

          assert [
              row["recommendation_source_rank"]
              for row in rows
          ] == [2, 1]

          assert rows[0]["recommendation_action"] == DECISION_HOLD
          assert (
              rows[1]["recommendation_action"]
              == DECISION_CONSIDER_NEW_POSITION
          )

          assert all(
              row["recommendation_source"]
              == "CANONICAL_8E_DECISION"
              for row in rows
          )

          assert all(
              row["recommended_symbol"] is None
              and row["decision_winner"] is None
              and row["allocation"] is None
              and row["target_weight"] is None
              and row["quantity"] is None
              and row["trade"] is None
              and row["order"] is None
              for row in rows
          )
          PY
