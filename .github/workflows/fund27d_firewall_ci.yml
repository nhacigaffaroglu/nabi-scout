name: FUND27D Firewall CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "services/turkiye_fund_production_automation.py"
      - "services/turkiye_fund_controlled_execution.py"
      - "services/turkiye_fund_wealth_os_integration.py"
      - "services/wealth_core_service.py"
      - "tests/test_fund27d_automation_firewall.py"
      - "tests/test_turkiye_fund_controlled_execution.py"
      - "tests/test_fund27c_materialization_recovery.py"
      - ".github/workflows/fund27d_production_automation.yml"
      - ".github/workflows/fund27d_firewall_ci.yml"

permissions:
  contents: read

concurrency:
  group: fund27d-firewall-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firewall-ci:
    name: fund27d-firewall-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Run FUND27D regression contract
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_fund27d_automation_firewall.py \
            tests/test_turkiye_fund_controlled_execution.py \
            tests/test_fund27c_materialization_recovery.py \
            tests/test_turkiye_fund_wealth_os_integration.py \
            tests/test_wealth_core.py \
            tests/test_wealth_transaction_idempotency_migration.py

      - name: Compile execution boundary
        run: |
          python -m py_compile \
            services/turkiye_fund_production_automation.py \
            services/turkiye_fund_controlled_execution.py \
            services/turkiye_fund_wealth_os_integration.py \
            services/wealth_core_service.py

      - name: Verify automation source firewall
        run: |
          grep -n 'mode=MODE_DRY_RUN' \
            services/turkiye_fund_production_automation.py

          grep -n 'execution_authority=False' \
            services/turkiye_fund_production_automation.py

          grep -n 'wealth_core_service=None' \
            services/turkiye_fund_production_automation.py

          ! grep -n '\.post_transaction(' \
            services/turkiye_fund_production_automation.py

          ! grep -nEi \
            'MODE_EXECUTE|create_order|submit_order|place_order|execute_trade|broker_api' \
            services/turkiye_fund_production_automation.py

      - name: Verify production workflow hardening
        run: |
          grep -n 'contents: read' \
            .github/workflows/fund27d_production_automation.yml

          grep -n 'cancel-in-progress: false' \
            .github/workflows/fund27d_production_automation.yml

          grep -n 'timeout-minutes:' \
            .github/workflows/fund27d_production_automation.yml

          ! grep -nEi \
            'secrets\.|MODE_EXECUTE|execution_authority[=: ]+true|post_transaction|create_order|submit_order|place_order|execute_trade|broker_api' \
            .github/workflows/fund27d_production_automation.yml

          echo "FUND27D_FIREWALL_CI_OK"
